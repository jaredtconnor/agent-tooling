<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR guide</title>
<style>
:root {
  --bg:#0f1011; --panel:#151618; --panel2:#1c1d20; --border:#2a2b30; --fg:#e3e4e6; --muted:#8a8f98; --accent:#7c84f0;
  --green:#4cb782; --red:#eb5757; --yellow:#f2c94c; --blue:#4ea7fc; --orange:#f2994a;
  --add:rgba(76,183,130,.12); --add-n:rgba(76,183,130,.24); --del:rgba(235,87,87,.12); --del-n:rgba(235,87,87,.24);
  --tk:#c4a7ff; --ts:#a8d4a0; --tc:#6f7681; --tn:#f5b97a; --tt:#7fc8ff; --ta:#e6c07b;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#fff; --panel:#f7f8f9; --panel2:#eef0f2; --border:#dfe1e5; --fg:#1b1c1f; --muted:#6b6f76; --accent:#5e6ad2;
    --green:#2e9e63; --red:#d14343; --yellow:#b8860b; --blue:#1f6fd1; --orange:#c76a12;
    --add:rgba(46,160,67,.11); --add-n:rgba(46,160,67,.22); --del:rgba(215,58,73,.09); --del-n:rgba(215,58,73,.2);
    --tk:#7a3fc8; --ts:#2f7d32; --tc:#8b9098; --tn:#b4590b; --tt:#1d63b8; --ta:#8a6100;
  }
}
* { box-sizing:border-box }
html, body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--sans) }
a { color:var(--accent); text-decoration:none } a:hover { text-decoration:underline }
p { margin:0 0 8px } p:last-child { margin-bottom:0 }
code { font-family:var(--mono); font-size:12.5px; background:var(--panel2); padding:1px 5px; border-radius:4px }
header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 24px 0 }
.crumbs { display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:13px }
.crumbs .title { color:var(--fg); font-weight:600 }
.plus { color:var(--green) } .minus { color:var(--red) }
.chip { display:inline-flex; align-items:center; gap:4px; padding:0 8px; border:1px solid var(--border); border-radius:999px; font-size:11.5px; color:var(--muted); background:var(--panel); white-space:nowrap }
.bar { display:flex; align-items:end; gap:4px; margin-top:8px }
.tab { background:none; border:0; color:var(--muted); padding:6px 12px 8px; cursor:pointer; font:inherit; border-bottom:2px solid transparent }
.tab:hover { color:var(--fg) } .tab.on { color:var(--fg); border-bottom-color:var(--accent) }
.tab .n { margin-left:5px; font-size:11px; color:var(--muted) }
.tools { margin-left:auto; display:flex; gap:6px; padding-bottom:6px }
.btn { background:var(--panel2); border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:3px 10px; font:inherit; font-size:12.5px; cursor:pointer }
.btn:hover { border-color:var(--accent) } .btn:disabled { opacity:.4; cursor:default }
main { padding:20px 24px 80px; max-width:1800px }
.view { display:none } .view.on { display:block }
h1 { font-size:22px; margin:0 0 2px; font-weight:650 }
h2 { font-size:17px; margin:0 0 6px; font-weight:600 }
h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px; font-weight:600 }
h3:first-child { margin-top:0 }
.meta { color:var(--muted); font-size:12.5px; font-family:var(--mono) }
.muted { color:var(--muted) } .small { font-size:12.5px }
.card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px }
.stack > * + * { margin-top:16px }
.cols { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr); gap:16px; margin-top:16px; align-items:start }
.tldr { font-size:17px; line-height:1.6 }
.pill { display:inline-block; padding:0 8px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid currentColor; white-space:nowrap; line-height:18px }
.c-good { color:var(--green) } .c-warn { color:var(--yellow) } .c-bad { color:var(--red) } .c-info { color:var(--blue) } .c-mute { color:var(--muted) } .c-orange { color:var(--orange) }
.list { list-style:none; padding:0; margin:0 }
.list > li { padding:8px 0; border-top:1px solid var(--border) } .list > li:first-child { border-top:0; padding-top:0 }
.row { display:flex; gap:8px; align-items:baseline }
.grow { flex:1; min-width:0 }
.click { cursor:pointer } .click:hover .lbl { color:var(--accent) }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center }
.stats b { display:block; font-size:20px }
.verdict-head { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px }

/* guide */
.guide { display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr); gap:24px; align-items:start }
.side { position:sticky; top:96px; max-height:calc(100vh - 112px); overflow:auto; padding-right:4px }
.counter { font-family:var(--mono); font-size:12.5px; color:var(--muted); display:flex; gap:12px; align-items:center; margin:2px 0 12px }
.counter b { color:var(--fg) }
.summary { font-size:14.5px; line-height:1.6 }
.flist li { display:flex; gap:8px; font-size:12.5px; padding:3px 0; cursor:pointer; align-items:baseline }
.flist .nm { font-weight:500 } .flist .dir { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0 }
.flist li:hover .nm { color:var(--accent) }
.toc li { display:flex; gap:8px; padding:3px 0; font-size:13px; cursor:pointer; color:var(--muted) }
.toc li.on { color:var(--fg); font-weight:600 } .toc li:hover { color:var(--accent) }
.toc .ck { width:14px; color:var(--green) }
.nav { display:flex; gap:8px; margin-top:16px }

/* diff */
.file { border:1px solid var(--border); border-radius:8px; margin-bottom:18px; background:var(--panel); overflow:clip }
.fhead { display:flex; gap:10px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--border); font-size:12.5px; position:sticky; top:84px; z-index:2; background:var(--panel) }
.fhead .nm { font-weight:600 } .fhead .dir { color:var(--muted) }
.fhead label { margin-left:auto; display:flex; gap:5px; align-items:center; color:var(--muted); cursor:pointer }
.file.done .body { display:none } .file.done.open .body { display:block }
.diff td.hit { background:rgba(242,201,76,.16) } .diff td.ln.hit { background:rgba(242,201,76,.3); color:var(--fg); opacity:1 }
.gap-head { background:var(--panel2); padding:4px 12px; border-top:1px solid var(--border) }
.proposal { margin-top:8px; border:1px solid var(--border); border-radius:6px; overflow:hidden }
.proposal .ph { padding:4px 10px; background:var(--panel2); font-size:12px; color:var(--muted) }
.proposal .ph strong { color:var(--fg) }
.proposal .pn { padding:6px 10px; border-top:1px solid var(--border); font-size:12.5px }
.finding .copy { margin-left:auto; font-size:11.5px; padding:1px 8px }
.empty { padding:12px; color:var(--muted); font-size:12.5px }
table.diff { width:100%; border-collapse:collapse; font:12px/1.6 var(--mono); table-layout:fixed }
.diff td { padding:0 10px; white-space:pre-wrap; overflow-wrap:anywhere; vertical-align:top }
.diff td.ln { width:54px; text-align:right; color:var(--muted); user-select:none; padding:0 8px; opacity:.75 }
.diff tr.gap td { background:var(--panel2); color:var(--muted); padding:3px 12px; font-size:11.5px }
.diff td.a { background:var(--add) } .diff td.ln.a { background:var(--add-n); opacity:1 }
.diff td.d { background:var(--del) } .diff td.ln.d { background:var(--del-n); opacity:1 }
.diff td.e { background:var(--panel2) }
.diff tr.fnd td { padding:0; white-space:normal }
.finding { margin:8px 12px; border:1px solid var(--border); border-left:3px solid var(--yellow); background:var(--bg); border-radius:6px; padding:10px 12px; font:13.5px/1.5 var(--sans) }
.finding .hd { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:4px }
.finding .sg { margin-top:6px; padding-top:6px; border-top:1px dashed var(--border) }
.sev-blocker { border-left-color:var(--red) } .sev-major { border-left-color:var(--orange) } .sev-minor { border-left-color:var(--yellow) } .sev-nit { border-left-color:var(--muted) }
.flash { animation:flash 1.8s ease-out }
@keyframes flash { from { box-shadow:0 0 0 3px var(--accent) } to { box-shadow:0 0 0 3px transparent } }
.hljs-keyword,.hljs-literal,.hljs-meta .hljs-keyword,.hljs-selector-tag { color:var(--tk) }
.hljs-string,.hljs-regexp,.hljs-char { color:var(--ts) }
.hljs-comment,.hljs-quote,.hljs-doctag { color:var(--tc); font-style:italic }
.hljs-number,.hljs-symbol,.hljs-bullet { color:var(--tn) }
.hljs-title,.hljs-type,.hljs-built_in,.hljs-class .hljs-title,.hljs-title.class_,.hljs-title.function_ { color:var(--tt) }
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-params,.hljs-meta,.hljs-tag,.hljs-name { color:var(--ta) }

/* findings, canvas, structure, files */
.filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px }
.filters .btn.on { border-color:var(--accent); color:var(--accent) }
.findings .finding { margin:0 0 10px; cursor:pointer } .findings .finding:hover { border-color:var(--accent) }
.loc { font-family:var(--mono); font-size:12px; color:var(--muted) }
.gauge { display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--panel2); margin:8px 0 6px }
.gauge span { display:block; height:100% }
.cat { margin-top:14px }
.item { display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; padding:10px 0; border-top:1px solid var(--border) }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; height:24px }
.seg button { background:none; border:0; border-left:1px solid var(--border); color:var(--muted); font:12px var(--sans); padding:0 8px; cursor:pointer }
.seg button:first-child { border-left:0 }
.seg button.on[data-s=pass] { background:var(--add-n); color:var(--green) }
.seg button.on[data-s=concern] { background:rgba(242,201,76,.18); color:var(--yellow) }
.seg button.on[data-s=fail] { background:var(--del-n); color:var(--red) }
.seg button.on[data-s=na], .seg button.on[data-s=unchecked] { background:var(--panel2); color:var(--fg) }
.why { color:var(--muted); font-size:12px }
table.grid { width:100%; border-collapse:collapse; font-size:13px }
table.grid td, table.grid th { text-align:left; padding:7px 10px; border-top:1px solid var(--border); vertical-align:top }
table.grid th { color:var(--muted); font-weight:500; font-size:12px; border-top:0 }
.diagram { overflow:auto; text-align:center; padding:8px 0 }
.diagram svg { max-width:100% }
pre.src { text-align:left; font:12px/1.5 var(--mono); background:var(--panel2); padding:10px; border-radius:6px; overflow:auto; white-space:pre-wrap }
.files-layout { display:grid; grid-template-columns:minmax(260px,320px) minmax(0,1fr); gap:24px; align-items:start }
.st { font-family:var(--mono); font-size:11.5px; width:12px; font-weight:700 }
.st-added { color:var(--green) } .st-deleted { color:var(--red) } .st-renamed { color:var(--blue) } .st-modified { color:var(--yellow) }
kbd { font:11px var(--mono); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--muted) }
footer { color:var(--muted); font-size:12px; margin-top:28px }
@media (max-width:1100px) { .cols, .guide, .files-layout { grid-template-columns:1fr } .side { position:static; max-height:none } }
</style>
</head>
<body>
<header>
  <div class="crumbs" id="crumbs"></div>
  <div class="bar">
    <nav id="tabs"></nav>
    <div class="tools">
      <button class="btn" id="mode" title="Toggle split / unified diff"></button>
      <button class="btn" id="copy" title="Copy verdict, findings and canvas concerns as Markdown">Copy review notes</button>
    </div>
  </div>
</header>
<main>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-guide"></section>
  <section class="view" id="v-structure"></section>
  <section class="view" id="v-findings"></section>
  <section class="view" id="v-canvas"></section>
  <section class="view" id="v-files"></section>
</main>
<script type="application/json" id="pr-data">__PR_GUIDE_DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("pr-data").textContent);
const G = DATA.guide, FILES = DATA.files, CANVAS = DATA.canvas;
const CH = G.chapters, FINDINGS = G.findings || [];
const byPath = new Map(FILES.map(f => [f.path, f]));
const KEY = "grok-pr:" + G.id;
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + ":" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + ":" + k, JSON.stringify(v)); } catch {} },
};
let mode = store.get("mode", "split");
let cur = 0;
const mermaidReady = new Promise(resolve => {
  window.__mermaid = resolve;
  setTimeout(() => resolve(null), 8000);
});

// ---------- helpers ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(s) {
  return String(s ?? "").trim().split(/\n{2,}/).map(p => "<p>" + esc(p)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, "<br>") + "</p>").join("");
}
const mdEl = (s, cls) => el("div", { class: cls, html: md(s) });
const pad = n => String(n).padStart(2, "0");
const split = p => { const i = p.lastIndexOf("/"); return [p.slice(i + 1), i < 0 ? "" : p.slice(0, i + 1)]; };
const delta = (a, d) => [a ? el("span", { class: "plus" }, "+" + a) : null, d ? el("span", { class: "minus" }, " -" + d) : null];
function flash(node) { if (!node) return; node.scrollIntoView({ block: "center", behavior: "smooth" }); node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }

const TONE = {
  approve: "c-good", "approve-with-nits": "c-good", "request-changes": "c-orange", rethink: "c-bad",
  yes: "c-good", partial: "c-warn", no: "c-bad", unclear: "c-mute",
  good: "c-good", ok: "c-warn", poor: "c-bad",
  met: "c-good", missing: "c-bad",
  blocker: "c-bad", major: "c-orange", minor: "c-warn", nit: "c-mute",
  pass: "c-good", concern: "c-warn", fail: "c-bad", na: "c-mute", unchecked: "c-mute",
  verified: "c-good", inferred: "c-mute", "not-run": "c-mute",
  added: "c-good", removed: "c-bad", changed: "c-warn", moved: "c-info", renamed: "c-info",
};
const pill = (v, label) => v ? el("span", { class: "pill " + (TONE[v] || "c-mute") }, label || v) : null;
const SEV = ["blocker", "major", "minor", "nit"];

// ---------- diff rendering ----------
const LANG = { cs: "csharp", ts: "typescript", tsx: "typescript", js: "javascript", jsx: "javascript", mjs: "javascript", cjs: "javascript",
  py: "python", sql: "sql", json: "json", xml: "xml", csproj: "xml", props: "xml", targets: "xml", xaml: "xml", config: "xml", resx: "xml",
  html: "xml", htm: "xml", cshtml: "xml", razor: "xml", svg: "xml", yml: "yaml", yaml: "yaml", md: "markdown", sh: "bash", bash: "bash",
  ps1: "powershell", psm1: "powershell", go: "go", rs: "rust", java: "java", kt: "kotlin", css: "css", scss: "scss", vb: "vbnet",
  cpp: "cpp", cc: "cpp", hpp: "cpp", c: "c", h: "c", rb: "ruby", php: "php", swift: "swift", toml: "ini", ini: "ini", lua: "lua" };
function langFor(path) {
  const l = LANG[path.split(".").pop().toLowerCase()];
  return window.hljs && l && hljs.getLanguage(l) ? l : null;
}
function hl(text, lang) {
  if (!lang || text.length > 800) return esc(text);
  try { return hljs.highlight(text, { language: lang, ignoreIllegals: true }).value; } catch { return esc(text); }
}
function findingCard(f, withLoc) {
  const step = withLoc && f.chapter != null ? el("a", { class: "chip", href: "#guide/" + (f.chapter + 1), title: "Open in the guide",
    onclick: e => { e.preventDefault(); e.stopPropagation(); jumpFinding(f, "guide"); } }, "step " + (f.chapter + 1)) : null;
  return el("div", { class: "finding sev-" + f.severity, "data-fid": f.id },
    el("div", { class: "hd" }, pill(f.severity), el("span", { class: "chip" }, f.category),
      f.confidence === "inferred" ? el("span", { class: "chip", title: "Not verified by running code or reading every caller" }, "inferred") : null,
      el("strong", {}, f.title),
      withLoc && f.path ? el("span", { class: "loc grow", style: "text-align:right" }, f.path + (f.line ? ":" + f.line : ""), f.inDiff ? "" : " (outside diff)") : null,
      step,
      el("button", { class: "btn copy", title: "Copy as a PR review comment (Markdown)",
        onclick: e => { e.stopPropagation(); copyText(commentMarkdown(f), e.currentTarget, "Copy comment"); } }, "Copy comment")),
    f.detail ? mdEl(f.detail) : null,
    f.suggestion ? el("div", { class: "sg", html: "<strong>Suggestion</strong> " + md(f.suggestion) }) : null,
    proposalBlock(f));
}
// The expected shape of the fix: a before/after diff when it replaces lines, else the code to add.
function proposalBlock(f) {
  const p = f.proposal;
  if (!p) return null;
  const lang = langFor(p.path || f.path || "");
  const row = (sign, n, s) => el("tr", {}, el("td", { class: "ln " + sign }, n ?? ""), el("td", { class: sign, html: hl(s, lang) || " " }));
  const before = p.before ? p.before.lines.map((s, i) => row("d", p.before.start + i, s)) : [];
  // Display only: shift unindented expected code to the current code's indent so the two align.
  const indent = ls => Math.min(...ls.filter(s => s.trim()).map(s => s.match(/^\s*/)[0].length), Infinity);
  let code = p.code.replace(/\n+$/, "").split("\n");
  const shift = p.before ? indent(p.before.lines) - indent(code) : 0;
  if (shift > 0 && shift !== Infinity) code = code.map(s => s.trim() ? " ".repeat(shift) + s : s);
  const after = code.map(s => row(p.before ? "a" : "", "", s));
  const where = p.before ? `replaces lines ${p.replaces[0]}–${p.replaces[1]}` : p.replaces ? `replaces lines ${p.replaces[0]}–${p.replaces[1]} (current code not available)` : p.path ? "add to " + p.path : "";
  return el("div", { class: "proposal" },
    el("div", { class: "ph" }, el("strong", {}, "Expected shape"), where ? "  ·  " + where : ""),
    el("table", { class: "diff" }, el("colgroup", {}, el("col", { style: "width:54px" }), el("col")), el("tbody", {}, before, after)),
    p.note ? el("div", { class: "pn", html: md(p.note) }) : null);
}
function fenceLang(f) { const p = f.proposal.path || f.path || ""; return LANG[p.split(".").pop().toLowerCase()] || ""; }
function commentMarkdown(f) {
  const parts = [`**${f.title}**`];
  if (f.detail) parts.push(f.detail.trim());
  if (f.suggestion) parts.push(f.suggestion.trim());
  if (f.proposal) {
    parts.push("```" + fenceLang(f) + "\n" + f.proposal.code.replace(/\n+$/, "") + "\n```");
    if (f.proposal.note) parts.push(f.proposal.note.trim());
  }
  return parts.join("\n\n") + "\n";
}
function reviewedFiles() { return store.get("files", {}); }
function renderFile(file, hunkIds) {
  const [name, dir] = split(file.path);
  const hunks = hunkIds ? file.hunks.filter(h => hunkIds.includes(h.id)) : file.hunks;
  const add = hunks.reduce((s, h) => s + h.add, 0), del = hunks.reduce((s, h) => s + h.del, 0);
  const box = el("section", { class: "file", "data-path": file.path });
  const cb = el("input", { type: "checkbox", checked: !!reviewedFiles()[file.path] });
  cb.addEventListener("change", () => { const r = reviewedFiles(); r[file.path] = cb.checked; store.set("files", r); syncFileState(); });
  box.append(el("div", { class: "fhead" },
    el("span", { class: "st st-" + file.status, title: file.status }, file.status[0].toUpperCase()),
    el("span", { class: "nm" }, name), el("span", { class: "dir" }, file.status === "renamed" && file.oldPath !== file.path ? "← " + file.oldPath : dir),
    el("span", {}, delta(add, del)), el("label", {}, cb, "Reviewed")));
  if (file.binary || !hunks.length) {
    box.append(el("div", { class: "body empty" }, file.binary ? "Binary file changed." : "No textual changes (rename or mode change)."));
    return box;

      if (f.proposal) {
        const code = "```" + fenceLang(f) + "\n" + f.proposal.code.replace(/\n+$/, "") + "\n```";
        lines.push("", code.split("\n").map(s => "  " + s).join("\n"), "");
      }
    }
    lines.push("");
  }
  const concerns = CANVAS.categories.flatMap(c => c.items).filter(it => ["concern", "fail"].includes(st[it.id].status));
  if (concerns.length) {
    lines.push("### Checklist concerns");
    for (const it of concerns) lines.push(`- ${it.label}: ${st[it.id].status}` + (st[it.id].note ? ` (${st[it.id].note.replace(/\s+/g, " ")})` : ""));
  }
  return lines.join("\n").trim() + "\n";
}
async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "Copied"; setTimeout(() => { btn.textContent = label; }, 1500);
}
const copyNotes = () => copyText(reviewNotes(), document.getElementById("copy"), "Copy review notes");

document.getElementById("mode").addEventListener("click", () => {
  mode = mode === "split" ? "unified" : "split"; store.set("mode", mode);
  rendered.guide = rendered.files = false;
  if (tab === "guide" || tab === "files") render(tab);
  header();
});
document.getElementById("copy").addEventListener("click", copyNotes);
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= TABS.length) return go(TABS[n - 1][0]);
  if (tab !== "guide") return;
  if (e.key === "j" || e.key === "ArrowRight") go("guide", cur + 1);
  else if (e.key === "k" || e.key === "ArrowLeft") go("guide", cur - 1);
  else if (e.key === "r") { const d = chaptersDone(); d[cur] = !d[cur]; store.set("chapters", d); render("guide"); }
});
window.addEventListener("hashchange", route);
route();
</script>
