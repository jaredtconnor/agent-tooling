[project]
name = "skills-tooling"
version = "0.1.0"
description = "Dual-tool skill architecture: SKILL.md → .cursor/rules/*.mdc generator and freshness checks"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
