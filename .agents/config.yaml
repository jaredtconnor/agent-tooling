version: "1.0"

source:
  type: linear
  ref: OIS-462
  raw_title: "Phase 1 — Cross-tool architecture"

mandate:
  objective: >-
    Design and implement a shared-source skill architecture where every skill
    has a single canonical SKILL.md. A generator produces committed, auto-
    attaching Cursor .mdc rules, kept fresh by a pre-commit hook, covering
    every skill with compatibility notes for Claude-only features.
  constraints:
    - Artifacts must travel with clones (committed .cursor/rules/, no setup steps)
    - Generator fails loudly on malformed source (exit non-zero + file path + reason)
    - Idempotent: running generator twice produces byte-identical output
    - Resources are referenced by path, not inlined
    - Auto-attach by description matching (alwaysApply: false)
  acceptance_criteria:
    - generate_cursor_rules.py produces one .mdc per skills/*/SKILL.md
    - Regeneration is idempotent
    - Pre-commit hook enforces freshness (blocks commit if stale)
    - Skills using Task() or Skill(agent) have a visible compatibility note
    - Malformed frontmatter causes non-zero exit with file + reason
    - Name collision across skills causes non-zero exit

platform:
  git_remote: git@github.com:jaredtconnor/skills.git
  default_branch: main
  linear:
    team: OIS
    parent_issue: OIS-462
    sync_phases: false    # stay local per user direction; existing OIS-469/470/471 are historical phase stubs
    sync_tasks: false

dev_state:
  phase: breakdown
  objective: "Phase 1 — Cross-tool architecture"
  plan_file: plans/plan-ois-462.md
  flags:
    local: true
  linear_parent: OIS-462

phases:
  - id: p1-walking-skeleton
    name: "Walking skeleton: one skill → one .mdc"
    label: feature
    linear_ref: OIS-469  # the architecture-decision sub-issue (informational link)
    scope: >-
      Generate a valid Cursor rule for the refine skill, committed to .cursor/rules/refine.mdc,
      with auto-attach working in a Cursor session. Proves the transformation end-to-end on
      one real skill before going wide.
    whats_demoable:
      - ".cursor/rules/refine.mdc exists with correct frontmatter and body"
      - "Opening the repo in Cursor auto-attaches the refine rule when the conversation matches its description"
      - "Running scripts/generate_cursor_rules.py twice produces zero diff (idempotent)"
    relevant_context: >-
      From OIS-469 spec: canonical SKILL.md → .mdc, alwaysApply=false (auto-attach by description),
      resources referenced by path not inlined, output committed to .cursor/rules/. Existing
      cursor/rules/ placeholder gets replaced by .cursor/rules/ per Cursor convention.
    dependencies:
      blocked_by: []
      blocks:
        - p2-full-coverage-and-freshness
    tasks:
      - id: t1.1
        title: "Move placeholder: cursor/rules/ → .cursor/rules/"
        size: small
        worker_persona: backend-engineer
        layers: [project-structure]
        files: [".cursor/rules/.gitkeep", "cursor/rules/.gitkeep"]
        description: >-
          Remove the legacy cursor/rules/.gitkeep placeholder and create .cursor/rules/
          with its own .gitkeep. All downstream scripts target the dotted directory.
        unit_tests: []  # structural change, no unit tests
        verification:
          - "ls .cursor/rules/.gitkeep resolves"
          - "ls cursor/rules/ fails (directory removed)"
      - id: t1.2
        title: "Create generator with happy path (one skill only)"
        size: medium
        worker_persona: backend-engineer
        layers: [script]
        files:
          - scripts/generate_cursor_rules.py
          - tests/test_generator.py
          - pyproject.toml
        description: >-
          Implement Python script that reads skills/refine/SKILL.md, parses YAML frontmatter,
          and writes .cursor/rules/refine.mdc. Use PyYAML. Keep input path as a CLI arg so
          the function is testable. Establish pyproject.toml for uv-managed test deps.
        unit_tests:
          - "test_parse_frontmatter_extracts_name_and_description"
          - "test_emit_mdc_has_cursor_frontmatter_with_alwaysApply_false"
          - "test_emit_mdc_preserves_body_content"
          - "test_idempotent_regeneration_produces_no_diff"
        reference: "skills/refine/SKILL.md"
      - id: t1.3
        title: "Run generator against refine and commit .mdc"
        size: small
        worker_persona: backend-engineer
        layers: [integration]
        files: [".cursor/rules/refine.mdc"]
        description: >-
          Execute `uv run python scripts/generate_cursor_rules.py skills/refine/SKILL.md`
          and commit the resulting .mdc. Manual Cursor smoke test: open the repo, trigger
          a refine-intent conversation, confirm auto-attach fires.
        unit_tests: []
        verification:
          - ".cursor/rules/refine.mdc exists and is well-formed"
          - "Cursor auto-attaches refine rule on matching intent (manual check)"
    acceptance_criteria:
      happy_path:
        - "scripts/generate_cursor_rules.py skills/refine/SKILL.md writes a valid .mdc"
        - "Running the generator a second time produces zero file diff"
        - "Cursor auto-attaches .cursor/rules/refine.mdc when user intent matches its description"
      error_cases: []  # error handling is Phase 2
      verification_commands:
        - "uv run pytest tests/test_generator.py"
        - "diff <(uv run python scripts/generate_cursor_rules.py skills/refine/SKILL.md --stdout) .cursor/rules/refine.mdc"
    parallelisation_notes: >-
      t1.1 can run in parallel with t1.2 (different files). t1.3 depends on both.
    tdd_checklist:
      red:
        - "Write test_parse_frontmatter_extracts_name_and_description — verify fails"
        - "Write test_emit_mdc_has_cursor_frontmatter_with_alwaysApply_false — verify fails"
        - "Write test_idempotent_regeneration_produces_no_diff — verify fails"
      green:
        - "Implement frontmatter parser to pass parse test"
        - "Implement .mdc emitter to pass cursor-frontmatter test"
        - "Ensure deterministic output ordering to pass idempotency test"
      refactor:
        - "Extract reusable parse/emit functions"
        - "Review for code smells (argparse setup, file I/O isolation)"
        - "Confirm all tests still green"

  - id: p2-full-coverage-and-freshness
    name: "Full skill coverage + pre-commit freshness enforcement"
    label: feature
    linear_ref: OIS-470
    scope: >-
      Generator walks every skills/*/SKILL.md producing a .mdc for each, flags Claude-only
      features, fails loudly on malformed input, and a pre-commit hook blocks commits that
      would leave .cursor/rules/ stale.
    whats_demoable:
      - "Running the generator with no args produces one .mdc per skill in .cursor/rules/"
      - "Editing any SKILL.md and trying to commit without regenerating is blocked by pre-commit"
      - "A malformed SKILL.md (missing name, broken YAML, duplicate name) aborts with a helpful message naming the file"
      - "Skills that dispatch Claude agents (e.g. requesting-code-review) carry a visible 'Cursor-compat note' at the top of their .mdc"
    relevant_context: >-
      OIS-469 edge cases: fail-loudly on malformed source, name collision detection, resources
      referenced by path (not inlined). OIS-469 success criteria: idempotent, committed tree
      always matches generator output. Pre-commit.com framework chosen for portability.
    dependencies:
      blocked_by: [p1-walking-skeleton]
      blocks: [p3-docs-and-verification]
    tasks:
      - id: t2.1
        title: "Walk all skills + name collision detection"
        size: medium
        worker_persona: backend-engineer
        layers: [script]
        files:
          - scripts/generate_cursor_rules.py
          - tests/test_generator.py
        description: >-
          Extend generator to iterate over skills/*/SKILL.md, produce a .mdc per skill.
          Detect two skills with the same frontmatter `name:` and abort with a clear message
          listing conflicting paths.
        unit_tests:
          - "test_generator_produces_mdc_for_every_skill"
          - "test_name_collision_exits_nonzero_with_conflict_paths"
        reference: "skills/*/SKILL.md for iteration targets"
      - id: t2.2
        title: "Fail-loudly error handling for malformed source"
        size: medium
        worker_persona: backend-engineer
        layers: [script]
        files:
          - scripts/generate_cursor_rules.py
          - tests/test_generator.py
        description: >-
          Add explicit error paths: malformed YAML → non-zero exit with file + parse error;
          missing `name:` → non-zero exit naming the field; missing `description:` → non-zero
          exit naming the field. Each error must include the offending file path.
        unit_tests:
          - "test_malformed_yaml_exits_nonzero_with_file_and_reason"
          - "test_missing_name_field_exits_nonzero"
          - "test_missing_description_field_exits_nonzero"
      - id: t2.3
        title: "Claude-compat note detection + resource path preservation"
        size: medium
        worker_persona: backend-engineer
        layers: [script]
        files:
          - scripts/generate_cursor_rules.py
          - tests/test_generator.py
        description: >-
          Scan body for Task( and Skill(<agent-name>) references to known agent-dispatching
          skills. When found, prepend a Cursor-compat note banner to the .mdc. Preserve
          existing `resources/...` path references verbatim (no inlining).
        unit_tests:
          - "test_skill_with_Task_dispatch_gets_compat_note"
          - "test_skill_with_Skill_agent_reference_gets_compat_note"
          - "test_skill_without_claude_features_has_no_compat_note"
          - "test_resource_paths_preserved_verbatim"
        reference: "skills/requesting-code-review/SKILL.md (dispatches code-reviewer agent)"
      - id: t2.4
        title: "Freshness check script + .pre-commit-config.yaml"
        size: medium
        worker_persona: platform-engineer
        layers: [script, tooling]
        files:
          - scripts/check_cursor_rules_fresh.py
          - .pre-commit-config.yaml
          - tests/test_freshness_check.py
        description: >-
          check_cursor_rules_fresh.py runs the generator into a temp dir and diffs against
          committed .cursor/rules/; non-zero on any diff. Wire it as a pre-commit.com
          repo-local hook that runs on changes to skills/**/SKILL.md or the generator itself.
        unit_tests:
          - "test_freshness_check_passes_when_committed_matches_generator"
          - "test_freshness_check_fails_when_committed_is_stale"
        verification:
          - "pre-commit install succeeds"
          - "touching a SKILL.md without regenerating blocks `git commit`"
    acceptance_criteria:
      happy_path:
        - "Running the generator produces one .mdc per skill; committed tree matches"
        - "Pre-commit hook blocks commit when any .cursor/rules/ file is stale"
        - "Agent-dispatching skills (e.g. requesting-code-review) have a Cursor-compat note banner in their .mdc"
      error_cases:
        - "Malformed YAML → non-zero exit with file path + parse error"
        - "Missing name or description → non-zero exit naming the missing field"
        - "Two skills with the same `name:` → non-zero exit listing conflicts"
      verification_commands:
        - "uv run pytest tests/"
        - "uv run python scripts/generate_cursor_rules.py && uv run python scripts/check_cursor_rules_fresh.py"
        - "pre-commit run --all-files"
    parallelisation_notes: >-
      t2.1 and t2.2 both modify scripts/generate_cursor_rules.py — sequence them (t2.1 first,
      t2.2 on top). t2.3 can follow t2.2. t2.4 is independent of t2.1–t2.3 and can run in
      parallel once the generator interface is stable after t2.1.
    tdd_checklist:
      red:
        - "Write each failure-path test first (malformed, missing fields, collision)"
        - "Write compat-note tests before detection logic"
        - "Write freshness-check tests before implementing check script"
      green:
        - "Minimal implementation per test"
        - "Avoid speculative features — only what current test requires"
      refactor:
        - "Extract compat-note detection into a named predicate"
        - "Consolidate error message formatting"

  - id: p3-docs-and-verification
    name: "Docs, authoring guide, end-to-end verification"
    label: feature
    linear_ref: OIS-471
    scope: >-
      README explains dual-tool architecture; docs/ai-dlc/architecture.md captures the design
      decisions; a new-skill authoring guide shows how to write a SKILL.md that works in both
      tools; manual Cursor smoke test confirms the pipeline works end to end.
    whats_demoable:
      - "~/.skills/README.md has a 'Dual-tool architecture' section with diagram + pre-commit setup"
      - "docs/ai-dlc/architecture.md documents the canonical-source + generator decision"
      - "README 'Authoring a new skill' section walks through creating a skill that works in Claude + Cursor"
      - "Three core skills (refine, plan, breakdown) auto-attach correctly in a Cursor smoke test"
    relevant_context: >-
      OIS-469 success criteria: 'Cloning the repo on a fresh machine gives a Cursor user
      working auto-attached rules with no setup beyond git clone'. Docs must make that true
      by including pre-commit install in the authoring guide. Smoke test validates the
      activation behavior chosen in the spec (auto-attach by description).
    dependencies:
      blocked_by: [p2-full-coverage-and-freshness]
      blocks: []
    tasks:
      - id: t3.1
        title: "Write docs/ai-dlc/architecture.md"
        size: medium
        worker_persona: documentation-specialist
        layers: [docs]
        files: [docs/ai-dlc/architecture.md]
        description: >-
          Capture OIS-469 decisions in a permanent ADR-style document: single-source
          (SKILL.md), generator, output location (.cursor/rules/), activation mode,
          compat-note policy, freshness-enforcement mechanism. Include Claude-vs-Cursor
          consumption diagram.
      - id: t3.2
        title: "Add 'Dual-tool architecture' section to README.md"
        size: medium
        worker_persona: documentation-specialist
        layers: [docs]
        files: [README.md]
        description: >-
          Top-level README gets a section: ASCII diagram (SKILL.md → Claude native + generator
          → .cursor/rules/.mdc), pre-commit install instructions, link to
          docs/ai-dlc/architecture.md.
      - id: t3.3
        title: "Add 'Authoring a new skill' walkthrough"
        size: small
        worker_persona: documentation-specialist
        layers: [docs]
        files: [README.md]
        description: >-
          Step-by-step: create skills/<name>/SKILL.md with required frontmatter, run
          generator, commit both SKILL.md and generated .mdc. Note pre-commit will enforce
          freshness automatically after install.
      - id: t3.4
        title: "End-to-end Cursor smoke test"
        size: small
        worker_persona: qa-engineer
        layers: [manual-verification]
        files: [docs/ai-dlc/smoke-test-results.md]
        description: >-
          Open a test repo in Cursor. Trigger refine-, plan-, and breakdown-intent prompts
          in natural language. Confirm each auto-attaches the expected rule. Document results
          (screenshots optional) in docs/ai-dlc/smoke-test-results.md. Flag any
          description-match misfires so OIS-469 can be amended if needed.
    acceptance_criteria:
      happy_path:
        - "README.md has Dual-tool architecture section that renders correctly on GitHub"
        - "docs/ai-dlc/architecture.md covers all OIS-469 decisions"
        - "Authoring walkthrough takes a new user from 'I want a new skill' to 'it works in both tools' with no surprises"
        - "Smoke test results document all 3 core skills auto-attaching successfully"
      verification_commands:
        - "markdownlint README.md docs/ai-dlc/"
        - "gh pr view --web (human-reads the rendered README)"
    parallelisation_notes: >-
      t3.1 and t3.2/t3.3 can run in parallel (different files). t3.4 runs last, after docs
      are complete.
    verification_checklist:  # Phase label is feature, but Phase 3 work is docs/verification, use checklist style
      - "All new markdown is lint-clean"
      - "Internal links resolve (README → docs/ai-dlc/architecture.md)"
      - "Smoke test covers refine, plan, breakdown rules"

quality_gates:
  test: "uv run pytest"
  lint: "uv run ruff check ."
  format: "uv run ruff format ."

skills:
  default_execution: executing-tasks
  planning: plan
  breakdown: breakdown
  review: requesting-code-review

circuit_breakers:
  max_task_retries: 3
  max_phase_failures: 2
